[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-from-scratch"
version = "0.1.0"
description = "Proximal Policy Optimization in NumPy with hand-written gradients"
authors = [{ name = "Ankit Pawar" }]
license = { text = "Proprietary. All rights reserved; see LICENSE." }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["ppo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
